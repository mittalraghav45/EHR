name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surgery-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surgery-ui/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build
